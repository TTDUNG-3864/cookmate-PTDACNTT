<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Công thức Mới nhất | CookMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main>
    <section class="section" aria-labelledby="newRecipesHeading">
      <div class="container">
        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header-text">
            <h1 class="page-title" id="newRecipesHeading">
              <i class="fa-solid fa-clock" aria-hidden="true"></i>
              Công thức Mới nhất
            </h1>
            <p class="page-subtitle">Những công thức vừa được chia sẻ bởi cộng đồng CookMate</p>
          </div>
        </div>

        <!-- Recipe Grid -->
        <div class="recipe-grid" id="newRecipeGrid" role="list" aria-label="Công thức mới nhất">
          <!-- Populated by JS -->
        </div>
        <div id="newRecipePagination"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/data/categories.js"></script>
  <script src="../assets/js/data/ingredients.js"></script>
  <script src="../assets/js/data/users.js"></script>
  <script src="../assets/js/data/recipes.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var grid = document.getElementById('newRecipeGrid');
      if (!grid) return;

      var recipes = CookMateStorage.getAllRecipes()
        .filter(function(r) { return r.isNew; })
        .sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

      var pagEl = document.getElementById('newRecipePagination');
      if (recipes.length === 0) {
        grid.innerHTML = CookMateUI.createEmptyState(
          'fa-clock',
          'Chưa có công thức mới',
          'Các công thức mới sẽ xuất hiện tại đây. Hãy quay lại sau nhé!'
        );
        if (pagEl) pagEl.innerHTML = '';
        return;
      }

      var perPage = 12;
      var totalPages = Math.ceil(recipes.length / perPage);
      window.goToNewRecipePage = function(page) {
        var cur = Math.max(1, Math.min(totalPages, page || 1));
        var slice = recipes.slice((cur - 1) * perPage, cur * perPage);
        grid.innerHTML = slice.map(function(r) {
          return CookMateUI.createRecipeCard(r, { showNewBadge: true });
        }).join('');
        if (pagEl) pagEl.innerHTML = CookMateUI.createPagination(cur, totalPages, 'goToNewRecipePage');
        if (page) window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      window.goToNewRecipePage(1);
    });
  </script>
</body>
</html>
