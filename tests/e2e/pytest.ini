[pytest]
testpaths = .
pythonpath = .
addopts = -ra --strict-markers
markers =
    selfcheck: Pre-M1/M2 infrastructure, opaque-box AST guard, and suite count verification
    tier1: Tier 1 isolated per-feature checks (>=5 per feature, >=50 total)
    tier2: Tier 2 functional, negative, security, and edge checks (>=5 per feature, >=50 total)
    tier3: Tier 3 cross-feature pair and multi-page integration checks (>=10 total)
    tier4: Tier 4 full real-world browser E2E scenarios (>=5 total)
    requires_m1: Depends on M1 backend/schema implementation (Features 1-6)
    requires_m2: Depends on M2 frontend UI/wrapper implementation (Features 7-10)
    browser: Uses Playwright headless Chromium
